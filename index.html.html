<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#172235">
<title>ショットガイド - 反射軌道シミュレーター</title>
<style>
:root{color-scheme:dark;--bg:#101827;--panel:#1c293b;--line:#34445b;--text:#f4f7fb;--muted:#aab8ca;--accent:#258bd8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,sans-serif}
main{max-width:760px;margin:auto;padding:16px 13px 36px;display:grid;gap:13px}
h1{font-size:21px;margin:4px 0}p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px}
button,.filebtn{border:1px solid var(--line);border-radius:10px;background:#26364b;color:white;padding:11px 12px;font-size:14px;font-weight:600;cursor:pointer;text-align:center}
button.primary,.filebtn.primary{background:var(--accent);border-color:var(--accent)}
button.active{outline:2px solid #72c8ff}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
canvas{width:100%;height:auto;display:block;background:#172235;border-radius:9px;touch-action:none}
label.range{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:14px;margin:8px 0}
input[type=range]{grid-column:1/3;width:100%;accent-color:#45b8ff}
input[type=file]{display:none}
small{color:var(--muted);line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#111d2d;padding:10px;border-radius:9px}.stat span{display:block;color:var(--muted);font-size:11px}.stat b{font-size:16px}
#status{font-size:13px;color:#b8d4ec;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
  <header><h1>ショットガイド</h1><p>スクリーンショットに反射軌道を重ねる簡易シミュレーター（貫通タイプ向け）</p></header>
  <section class="panel">
    <div class="row">
      <label class="filebtn primary" for="file">写真・スクショを読み込む</label>
      <button id="clear">画像・設定をリセット</button>
      <input id="file" type="file" accept="image/*">
    </div>
    <div style="height:10px"></div>
    <canvas id="stage" width="600" height="800"></canvas>
    <p id="status" style="margin-top:9px">画像を選択してください。iPhoneでは「写真ライブラリ」からスクショを選べます。</p>
  </section>
  <section class="panel">
    <b>設定する項目</b>
    <div class="tools" style="margin-top:10px">
      <button id="wall" class="active">① 壁の範囲</button>
      <button id="start">② 発射位置</button>
      <button id="block">③ ブロック追加</button>
      <button id="aim">④ 狙いを決める</button>
    </div>
    <p id="hint" style="margin-top:10px">壁の左上、右下の順にタップしてください。</p>
    <div class="row" style="margin-top:10px">
      <button id="undo">最後のブロックを削除</button>
      <button id="remove">ブロック全削除</button>
    </div>
  </section>
  <section class="panel">
    <b>軌道設定</b>
    <label class="range"><span>最大反射回数</span><b id="rv">10回</b><input id="reflections" type="range" min="1" max="30" value="10"></label>
    <label class="range"><span>予測距離</span><b id="dv">10000</b><input id="distance" type="range" min="1000" max="30000" step="500" value="10000"></label>
    <label class="range"><span>線の太さ</span><b id="wv">3</b><input id="width" type="range" min="1" max="8" value="3"></label>
    <p><label><input id="show" type="checkbox" checked> 予測線を表示</label>　<label><input id="dots" type="checkbox" checked> 反射地点を表示</label></p>
  </section>
  <section class="panel">
    <b>ショット情報</b>
    <div class="stats" style="margin-top:10px">
      <div class="stat"><span>角度</span><b id="angle">—</b></div>
      <div class="stat"><span>反射回数</span><b id="count">—</b></div>
      <div class="stat"><span>予測距離</span><b id="travel">—</b></div>
    </div>
    <p style="margin-top:10px">敵・味方を貫通し、設定した壁と手動追加したブロックで反射する簡易モデルです。ゲーム内の当たり判定、速度変化、減速、ブロック仕様などを完全再現するものではありません。</p>
  </section>
  <button id="save" class="primary">軌道入り画像を保存</button>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id),canvas=$('stage'),ctx=canvas.getContext('2d');
let image=null,bounds=null,shot=null,aim=null,blocks=[],mode='wall',first=null,dragging=false,selecting=false,selectStart=null,selectCurrent=null;
let maxRef=10,maxDist=10000,lineWidth=3;
function setStatus(s){$('status').textContent=s}
function setMode(m){
 mode=m;first=null;
 ['wall','start','block','aim'].forEach(k=>$(''+k).classList.toggle('active',k===m));
 const msg={wall:'壁の左上、右下の順に2か所タップしてください。',start:'自分のキャラクターの中心をタップしてください。',block:'ブロックの左上、右下の順に2か所タップしてください。',aim:'発射位置からドラッグして狙いを決めてください。'};
 $('hint').textContent=msg[m];render();
}
function fitImage(w,h){
 const scale=Math.min(1400/w,1800/h,1);
 canvas.width=Math.max(1,Math.round(w*scale));canvas.height=Math.max(1,Math.round(h*scale));
}
function rect(a,b){return{x1:Math.min(a.x,b.x),y1:Math.min(a.y,b.y),x2:Math.max(a.x,b.x),y2:Math.max(a.y,b.y)}}
function point(e){
 const r=canvas.getBoundingClientRect();
 return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height};
}
function rayRect(x,y,vx,vy,r){
 let enter=-Infinity,exit=Infinity,enterAxis=-1,exitAxis=-1;
 for(let i=0;i<2;i++){
  const p=i?y:x,v=i?vy:vx,lo=i?r.y1:r.x1,hi=i?r.y2:r.x2;
  if(Math.abs(v)<1e-9){if(p<lo||p>hi)return null;continue}
  let a=(lo-p)/v,b=(hi-p)/v;
  if(a>b)[a,b]=[b,a];
  if(a>enter){enter=a;enterAxis=i}
  if(b<exit){exit=b;exitAxis=i}
  if(enter>exit)return null;
 }
 const inside=x>=r.x1&&x<=r.x2&&y>=r.y1&&y<=r.y2;
 const t=inside?exit:enter;
 const axis=inside?exitAxis:enterAxis;
 return t>1e-4?{t,axis}:null;
}
function calculate(){
 if(!bounds||!shot||!aim)return null;
 let dx=shot.x-aim.x,dy=shot.y-aim.y,L=Math.hypot(dx,dy);if(L<2)return null;
 let vx=dx/L,vy=dy/L,x=shot.x,y=shot.y,remaining=maxDist,hits=0,total=0;
 const points=[{x,y}];
 for(let n=0;n<500&&remaining>0&&hits<maxRef;n++){
  let candidates=[],h=rayRect(x,y,vx,vy,bounds);if(h)candidates.push(h);
  for(const b of blocks){h=rayRect(x,y,vx,vy,b);if(h)candidates.push(h)}
  candidates.sort((a,b)=>a.t-b.t);if(!candidates.length)break;
  const hit=candidates[0],d=Math.min(hit.t,remaining);
  x+=vx*d;y+=vy*d;remaining-=d;total+=d;points.push({x,y});
  if(d<hit.t-1e-5)break;
  if(hit.axis===0)vx=-vx;else vy=-vy;
  hits++;const epsilon=.05;x+=vx*epsilon;y+=vy*epsilon;remaining-=epsilon;
 }
 return{points,hits,total,angle:(Math.atan2(-dy,dx)*180/Math.PI+360)%360};
}
function render(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 if(image)ctx.drawImage(image,0,0,canvas.width,canvas.height);
 else{ctx.fillStyle='#172235';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#e8f1fb';ctx.font='18px sans-serif';ctx.fillText('スクリーンショットを読み込んでください',18,45)}
 if(bounds){ctx.strokeStyle='#36d5ff';ctx.lineWidth=2;ctx.setLineDash([8,5]);ctx.strokeRect(bounds.x1,bounds.y1,bounds.x2-bounds.x1,bounds.y2-bounds.y1);ctx.setLineDash([])}
 if(selecting&&selectStart&&selectCurrent){const r=rect(selectStart,selectCurrent);ctx.fillStyle='rgba(54,213,255,.12)';ctx.fillRect(r.x1,r.y1,r.x2-r.x1,r.y2-r.y1);ctx.strokeStyle=mode==='wall'?'#36d5ff':'#ff9850';ctx.lineWidth=3;ctx.setLineDash([7,4]);ctx.strokeRect(r.x1,r.y1,r.x2-r.x1,r.y2-r.y1);ctx.setLineDash([])}
 for(const b of blocks){ctx.fillStyle='rgba(255,145,70,.18)';ctx.fillRect(b.x1,b.y1,b.x2-b.x1,b.y2-b.y1);ctx.strokeStyle='#ff9850';ctx.lineWidth=2;ctx.strokeRect(b.x1,b.y1,b.x2-b.x1,b.y2-b.y1)}
 const result=calculate();
 if(result&&$('show').checked){
  ctx.beginPath();result.points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.strokeStyle='#ffe15b';ctx.lineWidth=lineWidth;ctx.lineJoin='round';ctx.stroke();
  if($('dots').checked)result.points.slice(1).forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fillStyle='#ff8955';ctx.fill()});
 }
 if(shot){ctx.beginPath();ctx.arc(shot.x,shot.y,Math.max(7,canvas.width/90),0,Math.PI*2);ctx.fillStyle='#32aaff';ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=2;ctx.stroke()}
 if(shot&&aim){ctx.beginPath();ctx.moveTo(shot.x,shot.y);ctx.lineTo(aim.x,aim.y);ctx.strokeStyle='#ff9850';ctx.lineWidth=2;ctx.stroke()}
 $('angle').textContent=result?result.angle.toFixed(1)+'°':'—';$('count').textContent=result?result.hits+'回':'—';$('travel').textContent=result?Math.round(result.total)+'px':'—';
}
async function loadFile(file){
 if(!file)return;
 setStatus('画像を読み込み中…');
 try{
  let bitmap;
  if('createImageBitmap' in window){
   try{bitmap=await createImageBitmap(file)}catch(err){bitmap=null}
  }
  if(bitmap){
   image=bitmap;fitImage(bitmap.width,bitmap.height);
  }else{
   const url=URL.createObjectURL(file);
   try{
    image=await new Promise((resolve,reject)=>{
     const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('ブラウザがこの画像形式を開けませんでした'));im.src=url;
    });
    fitImage(image.naturalWidth,image.naturalHeight);
   }finally{URL.revokeObjectURL(url)}
  }
  bounds=null;shot=null;aim=null;blocks=[];setStatus('読み込み成功！壁の範囲を設定してください。');setMode('wall');
 }catch(err){
  setStatus('読み込み失敗：'+(err&&err.message?err.message:'画像を開けませんでした')+'。スクショをJPEGまたはPNGとして保存して再試行してください。');
 }
}
$('file').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)loadFile(f);e.target.value=''});
canvas.addEventListener('pointerdown',e=>{
 if(!image)return;const p=point(e);
 if(mode==='wall'||mode==='block'){
  selecting=true;selectStart=p;selectCurrent=p;canvas.setPointerCapture(e.pointerId);render();
 }else if(mode==='start'){shot=p;aim=null;setStatus('発射位置を設定しました。狙いを決めてください。');render()}
 else if(mode==='aim'&&shot){dragging=true;canvas.setPointerCapture(e.pointerId);aim=p;render()}
 else if(mode==='aim'){setStatus('先に発射位置を設定してください。')}
});
canvas.addEventListener('pointermove',e=>{if(selecting){selectCurrent=point(e);render()}else if(dragging){aim=point(e);render()}});
canvas.addEventListener('pointerup',()=>{
 if(selecting){const r=rect(selectStart,selectCurrent||selectStart);if(r.x2-r.x1>4&&r.y2-r.y1>4){if(mode==='wall')bounds=r;else blocks.push(r);setStatus(mode==='wall'?'壁の範囲を設定しました。':'ブロックを追加しました。')}else setStatus('範囲が小さすぎます。もう一度ドラッグしてください。');selecting=false;selectStart=null;selectCurrent=null;render()}
 dragging=false;render();
});
canvas.addEventListener('pointercancel',()=>{selecting=false;selectStart=null;selectCurrent=null;dragging=false;render()});
$('wall').onclick=()=>setMode('wall');$('start').onclick=()=>setMode('start');$('block').onclick=()=>setMode('block');$('aim').onclick=()=>setMode('aim');
$('undo').onclick=()=>{blocks.pop();render()};$('remove').onclick=()=>{blocks=[];render()};
$('clear').onclick=()=>{image=null;bounds=null;shot=null;aim=null;blocks=[];fitImage(600,800);setStatus('画像を選択してください。');setMode('wall')};
$('reflections').oninput=e=>{maxRef=+e.target.value;$('rv').textContent=maxRef+'回';render()};
$('distance').oninput=e=>{maxDist=+e.target.value;$('dv').textContent=maxDist;render()};
$('width').oninput=e=>{lineWidth=+e.target.value;$('wv').textContent=lineWidth;render()};
$('show').onchange=render;$('dots').onchange=render;
$('save').onclick=()=>{if(!image){setStatus('先にスクショを読み込んでください');return}const a=document.createElement('a');a.download='shot-guide.png';a.href=canvas.toDataURL('image/png');a.click()};
fitImage(600,800);render();
})();
</script>
</body>
</html>
